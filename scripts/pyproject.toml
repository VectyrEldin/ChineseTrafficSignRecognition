[project]
name = "tsd-train"
version = "0.1.0"
description = "TrafficSignRecognition — TT100K 48 类 YOLO26s 训练/导出/评测脚本"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.204",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxsim>=0.8.1",
    "onnxslim>=0.1.99",
    "pillow>=13.0.0",
    "faster-coco-eval>=1.6.7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch       = { index = "pytorch-cu134" }
torchvision = { index = "pytorch-cu134" }

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"
